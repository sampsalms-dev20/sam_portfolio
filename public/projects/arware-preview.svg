<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="arGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    </pattern>
  </defs>
  
  <rect width="600" height="360" rx="12" fill="#090d16" />
  <rect width="600" height="360" fill="url(#grid)" />
  
  <!-- AR Viewfinder Box -->
  <rect x="80" y="50" width="440" height="260" rx="16" fill="none" stroke="url(#arGrad)" stroke-width="2" stroke-dasharray="8 8" opacity="0.6" />
  <path d="M 80 90 L 80 50 L 120 50" fill="none" stroke="#06b6d4" stroke-width="4" />
  <path d="M 480 50 L 520 50 L 520 90" fill="none" stroke="#06b6d4" stroke-width="4" />
  <path d="M 80 270 L 80 310 L 120 310" fill="none" stroke="#06b6d4" stroke-width="4" />
  <path d="M 480 310 L 520 310 L 520 270" fill="none" stroke="#06b6d4" stroke-width="4" />

  <!-- Simulated 3D Motherboard Component -->
  <rect x="200" y="100" width="200" height="160" rx="8" fill="#15803d" opacity="0.8" stroke="#22c55e" stroke-width="2" />
  <!-- CPU Socket -->
  <rect x="260" y="130" width="80" height="70" fill="#94a3b8" rx="4" />
  <rect x="275" y="145" width="50" height="40" fill="#e2e8f0" />
  <!-- RAM Slots -->
  <rect x="360" y="115" width="8" height="110" fill="#3b82f6" />
  <rect x="375" y="115" width="8" height="110" fill="#3b82f6" />

  <!-- Holographic AR Badge -->
  <rect x="230" y="270" width="140" height="28" rx="14" fill="url(#arGrad)" />
  <text x="300" y="289" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">ArWARE 3D WebAR</text>
</svg>
